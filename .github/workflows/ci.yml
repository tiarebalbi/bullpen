name: CI

on:
  push:
    branches: [main, post-01-use-case]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.23.3
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @bullpen/landing exec playwright install --with-deps chromium

      - name: turbo (affected)
        run: pnpm exec turbo run lint typecheck test build check:arch --affected

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            apps/landing/test-results/**
            apps/web/test-results/**
          retention-days: 7

      - name: turbo boundaries
        run: pnpm exec turbo boundaries

      - name: calm validate (Part 1 model)
        run: >
          npx --yes @finos/calm-cli@1.60.1 validate
          -a architecture/calm/moments/part-01.architecture.json
          -p architecture/calm/bullpen.pattern.json
          --strict -f junit -o calm-result.xml

      - name: calm validate (timeline)
        run: >
          npx --yes @finos/calm-cli@1.60.1 validate
          --timeline architecture/calm/bullpen.timeline.json
          --strict -f junit -o calm-timeline-result.xml

      - name: Upload CALM reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: calm-reports
          path: |
            calm-result.xml
            calm-timeline-result.xml
