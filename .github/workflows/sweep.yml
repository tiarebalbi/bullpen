name: Sweep

# Until 2026-12-01 the sweep runs from here, because the production daemon is stopped for the month (ADR-0033). The same sweeper, the same route.
# It does nothing unless the repository variable SWEEP_FROM_ACTIONS is "on"; delete the variable, or set it to anything else, to stop it with no commit.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: vars.SWEEP_FROM_ACTIONS == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # The end date: the quota resets on 1 December (UTC), so a forgotten workflow cannot outlive it.
      - name: Check the window
        id: window
        run: |
          if [[ "$(date -u +%F)" < "2026-12-01" ]]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The stopgap ended on 2026-12-01 (ADR-0033). Nothing was swept."
          fi

      # main only, so a branch can never run against production.
      - uses: actions/checkout@v7.0.1
        if: steps.window.outputs.open == 'true'
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: apps/sweeper/src

      - uses: actions/setup-node@v7.0.0
        if: steps.window.outputs.open == 'true'
        with:
          node-version: 22.23.3

      # The sweeper has no dependencies: Node 22 runs the TypeScript source as it is, as the container does. It loops every 5 s while orders are open, waits for the
      # open when it is near, and leaves cleanly on SIGTERM; `timeout` ends it before the next run starts. 124 is that ending, not a failure.
      - name: Run the sweeper
        if: steps.window.outputs.open == 'true'
        env:
          SWEEPER_TARGET_URL: ${{ vars.SWEEPER_TARGET_URL }}
          SWEEPER_TOKEN: ${{ secrets.SWEEPER_TOKEN }}
        run: |
          set +e
          timeout --signal=TERM 280 node apps/sweeper/src/main.ts
          code=$?
          if [ "$code" -eq 124 ]; then exit 0; fi
          exit "$code"
